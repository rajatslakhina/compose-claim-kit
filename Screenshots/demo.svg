<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
<text x="750.0" y="30" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold">swift&#160;run&#160;ComposeClaimDemo&#160;(real&#160;output,&#160;61&#160;lines)</text>
<text x="20" y="58" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">ComposeClaimKit&#160;demo:&#160;what&#160;an&#160;answer&#160;says&#160;about&#160;a&#160;compose&#160;project,&#160;checked&#160;with&#160;compose's&#160;own&#160;rules</text>
<text x="20" y="73" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="88" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[1]&#160;A&#160;correct&#160;answer&#160;about&#160;ports,&#160;service&#160;names&#160;and&#160;depends_on</text>
<text x="20" y="103" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;verified&#160;(3&#160;claims&#160;checked,&#160;3&#160;hold)</text>
<text x="20" y="118" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;`localhost:8080`&#160;works&#160;from&#160;the&#160;host&#160;(`web`&#160;publishes&#160;`8080:80`),&#160;as&#160;the&#160;answer&#160;says.</text>
<text x="20" y="133" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;`db:5432`&#160;works&#160;from&#160;inside&#160;`app`,&#160;as&#160;the&#160;answer&#160;says.</text>
<text x="20" y="148" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;`localhost:5433`&#160;works&#160;from&#160;the&#160;host&#160;(`db`&#160;publishes&#160;`5433:5432`),&#160;as&#160;the&#160;answer&#160;says.</text>
<text x="20" y="163" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="178" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[2]&#160;Host&#160;and&#160;container&#160;sides&#160;of&#160;a&#160;port&#160;mapping</text>
<text x="20" y="193" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(2&#160;claims&#160;checked,&#160;0&#160;hold,&#160;2&#160;wrong)</text>
<text x="20" y="208" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;The&#160;mapping&#160;is&#160;the&#160;other&#160;way&#160;round:&#160;`8080:80`&#160;maps&#160;host&#160;port&#160;8080&#160;to&#160;container&#160;port&#160;80&#160;(compose&#160;writes&#160;`HOST:CONTAINER`).</text>
<text x="20" y="223" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`localhost:80`&#160;does&#160;not&#160;work&#160;from&#160;the&#160;host:&#160;`web`&#160;publishes&#160;container&#160;port&#160;80&#160;as&#160;`8080:80`,&#160;and&#160;the&#160;host&#160;reaches&#160;a&#160;container&#160;only&#160;through&#160;its&#160;published&#160;port.</text>
<text x="20" y="238" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="253" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[3]&#160;The&#160;published&#160;port&#160;used&#160;between&#160;containers&#160;(one&#160;mistake,&#160;one&#160;finding)</text>
<text x="20" y="268" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="283" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`db:5433`&#160;does&#160;not&#160;work&#160;from&#160;inside&#160;`app`:&#160;containers&#160;reach&#160;each&#160;other&#160;on&#160;the&#160;container&#160;port,&#160;so&#160;use&#160;`db:5432`&#160;(the&#160;container&#160;port&#160;of&#160;`5433:5432`).</text>
<text x="20" y="298" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;compose&#160;file&#160;alone:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="313" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`DATABASE_URL`&#160;in&#160;`app`&#160;(`db:5433`)&#160;does&#160;not&#160;work&#160;from&#160;inside&#160;`app`:&#160;containers&#160;reach&#160;each&#160;other&#160;on&#160;the&#160;container&#160;port,&#160;so&#160;use&#160;`db:5432`&#160;(the&#160;container&#160;port&#160;of&#160;`5433:5432`).</text>
<text x="20" y="328" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="343" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[4]&#160;localhost&#160;inside&#160;a&#160;container&#160;(a&#160;URL&#160;a&#160;browser&#160;reads&#160;stays&#160;quiet)</text>
<text x="20" y="358" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="373" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`DATABASE_URL`&#160;in&#160;`api`&#160;(`localhost:5432`)&#160;does&#160;not&#160;work&#160;from&#160;inside&#160;`api`:&#160;inside&#160;a&#160;container&#160;`localhost`&#160;is&#160;that&#160;container&#160;itself,&#160;so&#160;use&#160;`db:5432`.</text>
<text x="20" y="388" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="403" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[5]&#160;depends_on&#160;and&#160;readiness</text>
<text x="20" y="418" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="433" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`depends_on`&#160;waits&#160;only&#160;for&#160;the&#160;dependency's&#160;container&#160;to&#160;start,&#160;not&#160;for&#160;it&#160;to&#160;be&#160;ready;&#160;use&#160;`condition:&#160;service_healthy`&#160;with&#160;a&#160;`healthcheck:`&#160;for&#160;that.</text>
<text x="20" y="448" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;rewrite:&#160;caution&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;to&#160;check)</text>
<text x="20" y="463" fill="#fcd34d" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;!!&#160;`app`&#160;waits&#160;for&#160;`db`&#160;to&#160;be&#160;healthy,&#160;but&#160;`db`&#160;has&#160;no&#160;`healthcheck:`;&#160;unless&#160;its&#160;image&#160;defines&#160;a&#160;HEALTHCHECK,&#160;`docker&#160;compose&#160;up`&#160;stops&#160;with:&#160;dependency&#160;failed&#160;to&#160;start:&#160;container&#160;&lt;project&gt;-db-1&#160;has&#160;no&#160;healthcheck&#160;configure</text>
<text x="20" y="478" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="493" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[6]&#160;Variable&#160;substitution&#160;and&#160;.env</text>
<text x="20" y="508" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(3&#160;claims&#160;checked,&#160;2&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="523" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;`nginx:${TAG:-latest}`&#160;gives&#160;`nginx:1.27`,&#160;as&#160;the&#160;answer&#160;says.</text>
<text x="20" y="538" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;`${PORT:-8080}`&#160;gives&#160;`8080`&#160;when&#160;`PORT`&#160;is&#160;empty,&#160;as&#160;the&#160;answer&#160;says.</text>
<text x="20" y="553" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`${TAG-latest}`&#160;does&#160;not&#160;give&#160;`latest`&#160;when&#160;`TAG`&#160;is&#160;empty:&#160;it&#160;gives&#160;an&#160;empty&#160;string&#160;(without&#160;a&#160;colon,&#160;`-`&#160;uses&#160;the&#160;default&#160;only&#160;when&#160;the&#160;variable&#160;is&#160;unset,&#160;not&#160;empty).</text>
<text x="20" y="568" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;follow-up:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="583" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;Variables&#160;in&#160;`.env`&#160;are&#160;not&#160;set&#160;inside&#160;the&#160;containers:&#160;compose&#160;uses&#160;them&#160;for&#160;substitution&#160;in&#160;the&#160;compose&#160;file;&#160;pass&#160;them&#160;with&#160;`env_file:`&#160;or&#160;`environment:`.</text>
<text x="20" y="598" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="613" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[7]&#160;Which&#160;value&#160;wins</text>
<text x="20" y="628" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(2&#160;claims&#160;checked,&#160;0&#160;hold,&#160;2&#160;wrong)</text>
<text x="20" y="643" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`.env`&#160;does&#160;not&#160;win&#160;over&#160;the&#160;shell:&#160;a&#160;variable&#160;exported&#160;in&#160;the&#160;shell&#160;takes&#160;precedence&#160;over&#160;`.env`.</text>
<text x="20" y="658" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`env_file:`&#160;does&#160;not&#160;win&#160;over&#160;`environment:`:&#160;a&#160;variable&#160;set&#160;in&#160;both&#160;takes&#160;the&#160;`environment:`&#160;value.</text>
<text x="20" y="673" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;rewrite:&#160;verified&#160;(3&#160;claims&#160;checked,&#160;3&#160;hold)</text>
<text x="20" y="688" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;The&#160;statement&#160;about&#160;the&#160;shell's&#160;environment&#160;and&#160;`.env`&#160;holds.</text>
<text x="20" y="703" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;The&#160;statement&#160;about&#160;`environment:`&#160;and&#160;`env_file:`&#160;holds.</text>
<text x="20" y="718" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;`${TAG}`&#160;gives&#160;`1.26`,&#160;as&#160;the&#160;answer&#160;says.</text>
<text x="20" y="733" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="748" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[8]&#160;expose&#160;does&#160;not&#160;publish</text>
<text x="20" y="763" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="778" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`expose`&#160;does&#160;not&#160;make&#160;a&#160;port&#160;reachable&#160;from&#160;the&#160;host:&#160;it&#160;opens&#160;it&#160;to&#160;other&#160;containers;&#160;publish&#160;it&#160;under&#160;`ports:`.</text>
<text x="20" y="793" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;rewrite:&#160;verified&#160;(1&#160;claim&#160;checked,&#160;1&#160;hold)</text>
<text x="20" y="808" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;The&#160;statement&#160;about&#160;`expose`&#160;holds.</text>
<text x="20" y="823" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="838" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[9]&#160;Other&#160;tools'&#160;YAML&#160;and&#160;other&#160;domains&#160;make&#160;no&#160;claims</text>
<text x="20" y="853" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;GitHub&#160;Actions:&#160;noClaims&#160;(no&#160;claims&#160;about&#160;a&#160;compose&#160;project)</text>
<text x="20" y="868" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;bash:&#160;noClaims&#160;(no&#160;claims&#160;about&#160;a&#160;compose&#160;project)</text>
<text x="20" y="883" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;Jetpack&#160;Compose:&#160;noClaims&#160;(no&#160;claims&#160;about&#160;a&#160;compose&#160;project)</text>
<text x="20" y="898" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="913" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">[10]&#160;A&#160;conversation:&#160;the&#160;same&#160;mistake&#160;stated&#160;again</text>
<text x="20" y="928" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;turn&#160;2:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong,&#160;1&#160;repeated)</text>
<text x="20" y="943" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`localhost:5432`&#160;does&#160;not&#160;work&#160;from&#160;inside&#160;`app`:&#160;inside&#160;a&#160;container&#160;`localhost`&#160;is&#160;that&#160;container&#160;itself,&#160;so&#160;use&#160;`db:5432`.&#160;[repeated]</text>
<text x="20" y="958" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;ledger:&#160;2&#160;reviews,&#160;2&#160;claims,&#160;2&#160;flagged,&#160;1&#160;repeated</text>
